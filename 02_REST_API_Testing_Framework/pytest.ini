[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: critical API checks
    posts: posts resource tests
    users: users resource tests
    comments: comments resource tests
    todos: todos resource tests
    albums: albums resource tests
    photos: photos resource tests
    contract: response schema and contract checks
    edge_cases: boundary values and unusual inputs
    headers: HTTP headers and content type checks
    filtering: query filtering and pagination-like parameters
    crud: create, update, patch, and delete requests
    negative: invalid input and missing resource checks
    robustness: response stability and basic performance checks
    data_integrity: relationships and consistency between resources
